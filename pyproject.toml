[build-system]
requires = ["setuptools>=84.2.1", "wheel>=0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dlt-hardcharger"
dynamic = ["version"]
description = "dlt destination for Hardcharger, GizmoData's DuckDB 2.0 server"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10,<3.15"
authors = [{ name = "Philip Moore", email = "philip@gizmodata.com" }]
dependencies = [
    "dlt[sqlalchemy]>=1.32.0,<2",
    "sqlalchemy-hardcharger>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
    "hardcharger>=2.12.0",
    "pytest>=9.2.0",
]

[project.entry-points.dlt]
dlt_hardcharger = "dlt_hardcharger"

[tool.setuptools.dynamic]
version = { attr = "dlt_hardcharger._version.__version__" }

[tool.setuptools.packages.find]
include = ["dlt_hardcharger*"]

[tool.setuptools.package-data]
dlt_hardcharger = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration"]
addopts = "-ra"
filterwarnings = [
    "error",
    # dlt's own SQLAlchemy merge job (merge_job.py) passes subqueries where SQLAlchemy wants
    # them wrapped; the statements it builds are the tested ones.
    "ignore:implicitly coercing SELECT object to scalar subquery:sqlalchemy.exc.SAWarning",
    "ignore:Coercing Subquery object into a select:sqlalchemy.exc.SAWarning",
]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N"]

[tool.ruff.lint.per-file-ignores]
# dlt's incremental cursor is declared as an argument default: `since=dlt.sources.incremental("id")`.
"tests/*" = ["B008"]
